[package]
name = "nyx-chat"
version = "0.1.0"
description = "A desktop chat client for local models in Nyx AI Core, remote llama.cpp servers and Ollama, with tools and a GGUF marketplace"
license = "MIT"
repository = "https://github.com/design-nexus/nyx-chat"
authors = ["Ken Smith"]
edition = "2024"

[[bin]]
name = "nyx-chat"
path = "src/main.rs"

[dependencies]
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "a258c315f056ac649586fdb55e98613056221411" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "914b14ec5574ca04cbb985b571cfbfb0a42aae15" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "914b14ec5574ca04cbb985b571cfbfb0a42aae15" }
nyx-ai-client = { git = "https://github.com/design-nexus/nyx-ai.git", rev = "277b9a5b11fead7850bc8ce68ddc57f08c09f983" }
anyhow = "1"
async-channel = "2"
nyx-voice-client = { git = "https://github.com/design-nexus/nyx-voice.git", rev = "81fb1e556e40381e479e81fa1c1c32a372fa7fd8" }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = "0.3"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
libc = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "parsing", "regex-fancy"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process", "io-util", "fs", "macros"] }
toml = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tokio = { version = "1", features = ["net"] }
